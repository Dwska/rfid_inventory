<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RFID Inventory{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f4; color: #1c1917; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }

    .navbar {
      background: #fff; border-bottom: 1px solid #e7e5e4;
      padding: 0 1.5rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-links a {
      padding: 6px 12px; border-radius: 6px; font-size: 13px; color: #57534e;
      transition: background 0.15s;
    }
    .nav-links a:hover, .nav-links a.active { background: #f5f5f4; color: #1c1917; }
    .nav-user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #dbeafe; color: #1e40af;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 500;
    }
    .badge-green  { background: #dcfce7; color: #15803d; }
    .badge-yellow { background: #fef9c3; color: #a16207; }
    .badge-red    { background: #fee2e2; color: #b91c1c; }
    .badge-blue   { background: #dbeafe; color: #1d4ed8; }

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 22px; font-weight: 600; }
    .page-header p { color: #78716c; font-size: 14px; margin-top: 4px; }

    .card {
      background: #fff; border: 1px solid #e7e5e4;
      border-radius: 12px; padding: 1.25rem;
    }
    .card-sm { padding: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

    .metric-card { background: #fff; border: 1px solid #e7e5e4; border-radius: 12px; padding: 1.25rem; }
    .metric-label { font-size: 12px; color: #78716c; margin-bottom: 6px; }
    .metric-value { font-size: 28px; font-weight: 600; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
      border: 1px solid #e7e5e4; background: #fff; cursor: pointer;
      transition: background 0.15s; color: #1c1917;
    }
    .btn:hover { background: #f5f5f4; }
    .btn-primary { background: #1c1917; color: #fff; border-color: #1c1917; }
    .btn-primary:hover { background: #292524; }
    .btn-danger { background: #fff; color: #b91c1c; border-color: #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .stock-bar { width: 100%; height: 5px; border-radius: 3px; background: #e7e5e4; overflow: hidden; margin-top: 6px; }
    .stock-fill { height: 100%; border-radius: 3px; }
    .fill-ok   { background: #16a34a; }
    .fill-low  { background: #ca8a04; }
    .fill-crit { background: #dc2626; }

    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; padding: 10px 12px; font-weight: 500; color: #78716c; border-bottom: 1px solid #e7e5e4; }
    .table td { padding: 10px 12px; border-bottom: 1px solid #f5f5f4; }
    .table tr:last-child td { border: none; }
    .table tr:hover td { background: #fafaf9; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%; padding: 9px 12px; border: 1px solid #e7e5e4;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus { border-color: #a8a29e; }
    .form-error { color: #b91c1c; font-size: 12px; margin-top: 4px; }

    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 1rem; }
    .alert-success { background: #dcfce7; color: #15803d; }
    .alert-error   { background: #fee2e2; color: #b91c1c; }
    .alert-info    { background: #dbeafe; color: #1d4ed8; }
    .alert-warning { background: #fef9c3; color: #a16207; }

    .empty-state { text-align: center; padding: 3rem; color: #a8a29e; font-size: 14px; }
  </style>
</head>
<body>

{% if rfid_user %}
<nav class="navbar">
  <div class="nav-brand">
    <span class="nav-dot"></span>
    Room Inventory
  </div>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'inventory_list' %}">Inventory</a>
    <a href="{% url 'cart' %}">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a>
    <a href="{% url 'transaction_log' %}">Log</a>
  </div>
  <div class="nav-user">
    <div class="avatar">{{ rfid_user.full_name|slice:":2"|upper }}</div>
    <span>{{ rfid_user.full_name }}</span>
    <a href="{% url 'rfid_logout' %}" class="btn btn-sm">Sign out</a>
  </div>
</nav>
{% endif %}

<div class="container">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
